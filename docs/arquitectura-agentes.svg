<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1200" role="img" aria-labelledby="dg-title dg-desc">
        <title id="dg-title">Diagrama de la arquitectura</title>
        <desc id="dg-desc">De izquierda a derecha: lo externo (app Expo, Entra ID, administradores, Akamai, Netskope, APNs); la cuenta iDMZ (API Gateway REST con su autorizador y el ALB web); la cuenta de la plataforma en us-east-1 con la VPC de servicios (NLB interno, app web, panel, Admin API, el backend api y las Lambdas vigilante y lanzadora; las Lambdas de contadores y cierre, dibujadas junto a DynamoDB, también están en esta VPC), DynamoDB, la cola SQS FIFO por la que entra toda ejecución (el backend encola los chats y Scheduler las tareas; la lanzadora las arranca), la VPC de agentes con el kernel en AgentCore Runtime V2, que llama directamente a Bedrock, y a su lado la VPC de integraciones MCP con el MCP Hub, mcp-documentos, mcp-hora y otros MCP conectados a la red corporativa, y los servicios regionales (SQS, EventBridge Scheduler, KMS, CloudWatch, Secrets Manager, S3, Bedrock y Knowledge Bases); abajo, los servicios gestionados de AgentCore (Memory, Code Interpreter y Evaluations). El hub lee el catálogo y las aprobaciones en DynamoDB (no dibujado). No se dibuja la VPC de Code Interpreter.</desc>
        <style>svg{--idmz:#b45309;--idmz-bg:#fdf3e7;--work:#0f766e;--work-bg:#e8f5f3;--core:#6d28d9;--core-bg:#f2edfd;--ext:#475569;--ext-bg:#eef1f5;--surface:#fff;--ink:#18202b;--muted:#5b6676;--line:#c9d0da;--wire:#3b4656;--accent:#1f6feb;--font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--font-sans:"IBM Plex Sans",system-ui,sans-serif;font-family:var(--font-sans);background:#fff}
.frame { fill: none; stroke-width: 1.5; }
.frame.idmz { stroke: var(--idmz); fill: var(--idmz-bg); }
.frame.work { stroke: var(--work); fill: var(--work-bg); }
.frame.vpc { stroke: var(--work); stroke-dasharray: 6 4; fill: var(--surface); fill-opacity: .55; }
.frame.core { stroke: var(--core); fill: var(--core-bg); }
.frame.engine { stroke: var(--core); stroke-dasharray: 6 4; fill: var(--surface); fill-opacity: .45; }
.frame-label { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; font-weight: 500; }
.frame-label.idmz { fill: var(--idmz); }
.box { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.box.ext { stroke: var(--ext); }
.bt { font-family: var(--font-display); font-size: 14px; font-weight: 600; fill: var(--ink); }
.bs { font-family: var(--font-body); font-size: 11.5px; fill: var(--muted); }
.mono { font-family: var(--font-mono); font-size: 11px; fill: var(--muted); }
.wire { fill: none; stroke: var(--wire); stroke-width: 1.6; }
.wire.dash { stroke-dasharray: 5 4; }
.wire.warn { stroke: var(--warn); stroke-dasharray: 5 4; }
.wl { font-family: var(--font-mono); font-size: 10.5px; fill: var(--muted); }
.badge circle { fill: var(--accent); }
.badge text { font-family: var(--font-mono); font-size: 11px; font-weight: 600; fill: var(--surface); text-anchor: middle; dominant-baseline: central; }
.bs-note { font-size: 12.5px; color: var(--muted); }</style>
