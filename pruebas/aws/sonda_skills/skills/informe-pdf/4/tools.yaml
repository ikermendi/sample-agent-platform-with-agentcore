# tools.yaml: cada entrada es una herramienta que el kernel registra al activar la skill
formato: 1
herramientas:
  - nombre: generar_pdf
    script: scripts/generar_pdf.py
    descripcion: Convierte un Markdown del espacio del chat en un PDF en salida/. Devuelve el nombre del fichero y las páginas.
    entrada:                       # esquema JSON de los argumentos; el kernel lo valida antes de lanzar el script
      type: object
      properties:
        origen: { type: string, description: "Ruta del Markdown, relativa al espacio del chat", pattern: "^[^/].*\\.md$" }
        titulo: { type: string, maxLength: 120 }
        orientacion: { type: string, enum: [vertical, horizontal] }
      required: [origen]
      additionalProperties: false
    salida:                        # lo que el script escribe en stdout; el resumen solo puede usar estos campos
      type: object
      properties:
        nombre_fichero: { type: string }
        ruta: { type: string }
        paginas: { type: integer }
        bytes: { type: integer }
        variables_aws: { type: integer }   # solo para la sonda: cuántas AWS_* ve el script
      required: [nombre_fichero, ruta, paginas]
    etiqueta: "Generando el PDF"   # lo que la app pinta en la tarjeta de la herramienta
    resumen: "PDF {nombre_fichero} ({paginas} págs.)"  # cómo se resume el resultado en el mensaje consolidado
    escribe_ficheros: true         # la revisión lo muestra; tras la herramienta, el kernel sube los cambios
    confirmar: false               # true: pide aprobación del usuario antes de cada llamada
    tiempo_max_s: 60
  - nombre: contar_paginas
    script: scripts/contar_paginas.py
    descripcion: Cuenta las páginas que tendría el PDF de un Markdown, sin generarlo.
    entrada:
      type: object
      properties:
        origen: { type: string }
      required: [origen]
    etiqueta: "Contando páginas"
librerias: [weasyprint]            # no está en la imagen: el panel rechaza esta versión
